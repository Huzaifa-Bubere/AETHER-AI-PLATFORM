services:
  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - smart-interview-network

  # Backend (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - PORT=5001
      - MONGODB_URI=${MONGODB_URI}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - REDIS_URL=redis://redis:6379
      - PYTHON_AI_SERVER_URL=http://ai-server:8000
      - PYTHON_AI_SERVER_API_KEY=${PYTHON_AI_SERVER_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - ALLOW_UNSAFE_LOCAL_CODE_EXECUTION=${ALLOW_UNSAFE_LOCAL_CODE_EXECUTION:-true}
      # Optional JobSpy source (spec §66, §67). Inside Docker the backend must
      # reach the service by NAME, never localhost. Disabled by default.
      - JOBSPY_ENABLED=${JOBSPY_ENABLED:-false}
      - JOBSPY_SERVICE_URL=http://job-provider-service:8010
      - JOBSPY_SOURCES=${JOBSPY_SOURCES:-}
      - JOBSPY_RESULTS_PER_SOURCE=${JOBSPY_RESULTS_PER_SOURCE:-25}
      - JOBSPY_TIMEOUT_MS=${JOBSPY_TIMEOUT_MS:-30000}
      # Adzuna market. Previously hardcoded to the UK endpoint for every user.
      - ADZUNA_COUNTRY=${ADZUNA_COUNTRY:-in}
    # Persist locally-stored interview recordings and logs across container restarts
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      - mongodb
      - redis
      - ai-server
      - job-provider-service
    networks:
      - smart-interview-network

  # Optional JobSpy-backed provider service (spec §6–§9, §66).
  # Isolated from ai-server so JobSpy's scraping dependencies can never affect
  # MediaPipe / ML. Disabled by default: it starts, reports DISABLED on
  # /health, and queries nothing until JOBSPY_SOURCES is set.
  job-provider-service:
    build:
      context: ./job-provider-service
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      - JOBSPY_ENABLED=${JOBSPY_ENABLED:-false}
      - JOBSPY_SOURCES=${JOBSPY_SOURCES:-}
      - JOBSPY_TIMEOUT_SECONDS=${JOBSPY_TIMEOUT_SECONDS:-30}
    networks:
      - smart-interview-network

  # AI/ML Server (Python + FastAPI)
  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - PYTHON_AI_SERVER_API_KEY=${PYTHON_AI_SERVER_API_KEY}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ai-models:/app/models
    depends_on:
      - redis
    networks:
      - smart-interview-network

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=interview-platform
    volumes:
      - mongodb-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - smart-interview-network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - smart-interview-network

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - ai-server
    networks:
      - smart-interview-network
    profiles:
      - production

volumes:
  mongodb-data:
  redis-data:
  ai-models:
  backend_uploads:
  backend_logs:

networks:
  smart-interview-network:
    driver: bridge
