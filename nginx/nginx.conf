events {}

http {
    # AETHER proxy — interview recordings can be large webm uploads.
    client_max_body_size 110m;   # keep above the backend's 100MB recording cap
    proxy_request_buffering off; # stream large multipart bodies through

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # Frontend static app
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;   # recordings may take a while to upload
            proxy_send_timeout 300s;
        }

        # Backend API (multipart recording uploads included)
        location /api/ {
            proxy_pass http://backend:5001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            client_max_body_size 110m;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
